  "AGENTS.md#cross-cutting-handling-boundaries",
  "docs/reference.md#finite-batch-freshness-and-verification",
  "docs/design.md#end-to-end-flow",
]
skill = ".agents/skills/luwu-boundary-review/SKILL.md"
contends = ["proof-vs-cost", "footprint-vs-recovery"]
paths = [
  "src/luwu/filesystem.py",
  "src/luwu/paths.py",
  "tests/filesystem/**",
  "tests/interruption/**",
]
keywords = ["symlink", "atomic", "permission", "TOCTOU", "temporary", "fsync"]

