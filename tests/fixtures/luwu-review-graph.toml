# Luwu v2 review graph: test fixture for topology and routing.
# Paths are relative to the Luwu project; lint tests provide a stub tree.
version = 2
project = "luwu"

[[stake]]
id = "S1"
objective = "Nothing is written unless the exact bytes and identities that authorize it were re-read and re-verified at the write boundary; observation never writes."
evidence = ["AGENTS.md#cross-cutting-handling-boundaries", "docs/product.md#value-tests", "docs/design.md#end-to-end-flow", "docs/reference.md#finite-batch-freshness-and-verification"]

[[stake]]
id = "S2"
objective = "A profile-scale run stays inside measured budgets with durability and verification counted in, and cost must not grow as actions times directories."
evidence = ["docs/maintenance.md#performance-acceptance", "docs/design.md"]

[[stake]]
id = "S3"
objective = "Sensitive values and external capability stay out of repositories, persistence, caches, logs and machine-readable output, and fail closed when uncertain."
evidence = ["AGENTS.md", "docs/product.md#product-non-goals", "docs/reference.md#provider-owned-fields", "docs/design.md#rejected-alternatives"]

[[stake]]
id = "S4"
objective = "A later person or agent can tell what happened, why, and what safe action continues, from honest machine-readable results and continuous provenance."
evidence = ["docs/product.md#value-tests", "docs/reference.md#finite-batch-freshness-and-verification"]

[[stake]]
id = "S5"
objective = "Who may change a value stays declared and answerable; undeclared or conflicting content is never adopted by a default, force, or precedence rule."
evidence = ["docs/product.md#product-non-goals", "AGENTS.md", "docs/reference.md#baselines-adoption-and-explicit-mutation", "docs/reference.md#writing-undeclared-changes-back-to-a-template-source"]

[[stake]]
id = "S6"
objective = "The routine loop must finish on a real profile without hand-edited files or deleted baselines, and the previous manager must become genuinely removable."
evidence = ["docs/roadmap.md#m7a-daily-loop-usability", "docs/status.md#daily-loop-changes", "docs/roadmap.md#m9-real-project-migration-qualification", "docs/reference.md#commands"]

[[stake]]
id = "S7"
objective = "Act without damaging undeclared content, permissions or links, and without adding durable state of Luwu's own: a fresh plan is the recovery step."
evidence = ["AGENTS.md", "docs/design.md#rejected-alternatives", "docs/reference.md#finite-batch-freshness-and-verification", "docs/reference.md#commands"]

[[stake]]
id = "S8"
objective = "Two representations are equal only on format or parser evidence, and unsupported syntax is preserved or refused rather than normalized away."
evidence = ["docs/product.md#a-boundary-for-future-implementation", "docs/reference.md#structured-formats-and-field-comparison", "docs/reference.md#writing-undeclared-changes-back-to-a-template-source", "docs/design.md#rejected-alternatives"]

[[stake]]
id = "S9"
objective = "Only consequential differences reach the operator; incidental text, formatting, and converged state must not present themselves as drift."
evidence = ["docs/product.md#what-luwu-is-becoming", "docs/product.md#value-tests", "docs/product.md#a-boundary-for-future-implementation", "docs/design.md#observation-and-semantic-comparison"]

[[stake]]
id = "S11"
objective = "A capability is understandable from its current form in one place, without replaying the order in which it was delivered."
evidence = ["AGENTS.md#documentation-ownership", "docs/maintenance.md#test-layout", "docs/maintenance.md#run-output"]

[[stake]]
id = "S12"
objective = "Every claim is labelled as planned, implemented, historical, or verified-by-what, and no completion statement is carried forward unrevalidated."
evidence = ["AGENTS.md#role-and-authority", "docs/roadmap.md#roadmap-completion-rule", "docs/status.md"]

[[surface]]
id = "luwu-boundary-review"
title = "Luwu boundary review"
trigger = ["path validation, symlinks, target writes, atomicity, permissions, TOCTOU races, temporary files, or recoverability"]
owner_documents = ["AGENTS.md#cross-cutting-handling-boundaries", "docs/reference.md#finite-batch-freshness-and-verification", "docs/design.md#end-to-end-flow"]
skill = ".agents/skills/luwu-boundary-review/SKILL.md"
contends = ["proof-vs-cost", "footprint-vs-recovery"]
paths = ["src/luwu/filesystem.py", "src/luwu/paths.py", "tests/filesystem/**", "tests/interruption/**"]
keywords = ["symlink", "atomic", "permission", "TOCTOU", "temporary", "fsync"]

[[surface]]
id = "luwu-coherence-review"
title = "Luwu coherence review"
trigger = ["organization, tests, fixtures, docs, experiments, artifacts, or delivery labels"]
owner_documents = ["AGENTS.md#documentation-ownership", "docs/maintenance.md#test-layout", "docs/maintenance.md#run-output"]
skill = ".agents/skills/luwu-coherence-review/SKILL.md"
unopposed_stake = "S11"
paths = ["tests/**", "docs/**", "experiments/**"]
keywords = ["delivery", "milestone", "fixture", "changelog", "label"]

[[surface]]
id = "luwu-confidentiality-review"
title = "Luwu confidentiality review"
trigger = ["secrets, providers, template inputs, logs, JSON, persistence, caches, diffs, subprocesses, network, or debug output"]
owner_documents = ["AGENTS.md", "docs/reference.md#provider-owned-fields", "docs/design.md#rejected-alternatives"]
skill = ".agents/skills/luwu-confidentiality-review/SKILL.md"
contends = ["exposure-vs-continuity"]
paths = ["src/luwu/sensitivity.py", "src/luwu/providers.py", "src/luwu/records.py", "tests/providers/**"]
keywords = ["secret", "provider", "log", "cache", "redact", "stderr"]

[[surface]]
id = "luwu-consent-review"
