# Luwu review graph: test fixture for topology and routing.
#
# The stance and surface prose is not shipped. This graph records the
# relationships, the payers, the decisions a route must re-check, and the stakes
# nobody represents yet.
#
# Paths are relative to the Luwu project. The fixture is validated without path
# existence because it lives in the hydra-crux repository.

version = 1
project = "luwu"

[migration]
source = "Luwu 0cdc498"
old_stance_count = 5
new_stance_count = 9
note = "authority-vs-completion and equivalence-vs-noise were deferred by a five-stance working range. The owner documents already record sacrifices on both axes, so they are forged here. Nine is the result, not a quota."

[[stake]]
id = "S1"
objective = "Nothing is written unless the exact bytes and identities that authorize it were re-read and re-verified at the write boundary; observation never writes."
evidence = [
  "AGENTS.md#cross-cutting-handling-boundaries",
  "docs/product.md#value-tests",
  "docs/design.md#end-to-end-flow",
  "docs/reference.md#finite-batch-freshness-and-verification",
]
status = "represented"

[[stake]]
id = "S2"
objective = "A profile-scale run stays inside measured budgets with durability and verification counted in, and cost must not grow as actions times directories."
evidence = [
  "docs/maintenance.md#performance-acceptance",
  "docs/design.md",
]
status = "represented"

[[stake]]
id = "S3"
objective = "Sensitive values and external capability stay out of repositories, persistence, caches, logs and machine-readable output, and fail closed when uncertain."
evidence = [
  "AGENTS.md",
  "docs/product.md#product-non-goals",
  "docs/reference.md#provider-owned-fields",
  "docs/design.md#rejected-alternatives",
]
status = "represented"

[[stake]]
id = "S4"
objective = "A later person or agent can tell what happened, why, and what safe action continues, from honest machine-readable results and continuous provenance."
evidence = [
  "docs/product.md#value-tests",
  "docs/reference.md#finite-batch-freshness-and-verification",
]
status = "represented"

[[stake]]
id = "S5"
objective = "Who may change a value stays declared and answerable; undeclared or conflicting content is never adopted by a default, force, or precedence rule."
evidence = [
  "docs/product.md#product-non-goals",
  "AGENTS.md",
  "docs/reference.md#baselines-adoption-and-explicit-mutation",
  "docs/reference.md#writing-undeclared-changes-back-to-a-template-source",
]
status = "represented"

[[stake]]
id = "S6"
objective = "The routine loop must finish on a real profile without hand-edited files or deleted baselines, and the previous manager must become genuinely removable."
evidence = [
  "docs/roadmap.md#m7a-daily-loop-usability",
  "docs/status.md#daily-loop-changes",
  "docs/roadmap.md#m9-real-project-migration-qualification",
  "docs/reference.md#commands",
]
status = "represented"

[[stake]]
id = "S7"
objective = "Act without damaging undeclared content, permissions or links, and without adding durable state of Luwu's own: a fresh plan is the recovery step."
evidence = [
  "AGENTS.md",
  "docs/design.md#rejected-alternatives",
  "docs/reference.md#finite-batch-freshness-and-verification",
  "docs/reference.md#commands",
]
status = "represented"

[[stake]]
id = "S8"
objective = "Two representations are equal only on format or parser evidence, and unsupported syntax is preserved or refused rather than normalized away."
evidence = [
  "docs/product.md#a-boundary-for-future-implementation",
  "docs/reference.md#structured-formats-and-field-comparison",
  "docs/reference.md#writing-undeclared-changes-back-to-a-template-source",
  "docs/design.md#rejected-alternatives",
]
status = "represented"

[[stake]]
id = "S9"
objective = "Only consequential differences reach the operator; incidental text, formatting, and converged state must not present themselves as drift."
evidence = [
  "docs/product.md#what-luwu-is-becoming",
  "docs/product.md#value-tests",
  "docs/product.md#a-boundary-for-future-implementation",
  "docs/design.md#observation-and-semantic-comparison",
]
status = "represented"

[[stake]]
id = "S10"
objective = "One implementation per primitive, enforced by a test whose ceilings may only go down."
evidence = [
  "docs/design.md#shared-primitives",
  "tests/tooling/test_primitive_ownership.py",
  "docs/maintenance.md#preventing-duplicate-implementations",
]
status = "unopposed"

[[stake]]
id = "S11"
objective = "A capability is understandable from its current form in one place, without replaying the order in which it was delivered."
evidence = [
  "AGENTS.md#documentation-ownership",
  "docs/maintenance.md#test-layout",
  "docs/maintenance.md#run-output",
]
status = "unopposed"

[[stake]]
id = "S12"
objective = "Every claim is labelled as planned, implemented, historical, or verified-by-what, and no completion statement is carried forward unrevalidated."
evidence = [
  "AGENTS.md#role-and-authority",
  "docs/roadmap.md#roadmap-completion-rule",
  "docs/status.md",
]
status = "unopposed"

