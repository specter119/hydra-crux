[[unrepresented]]
id = "strong-consistency"
stake = "strong consistency against non-cooperating writers"
where = "docs/reference.md#commands; docs/design.md#rejected-alternatives; docs/status.md#verified-scope-and-limits"
why = "Advisory locks, rejected parallel writers, and no snapshot are stated as limits; neither strong consistency nor concurrency has a stance."

[[unrepresented]]
id = "machine-adaptation"
stake = "machine adaptation"
where = "docs/status.md#current-capability-matrix; docs/product.md#the-problem"
why = "Profiles have explicit selection and no platform detection, while the product problem starts from different machines having different boundaries. One declaration for several machines has no owner."

[[unrepresented]]
id = "human-facing-surface"
stake = "the human-facing surface"
where = "docs/product.md#what-luwu-is-becoming"
why = "The product asks for people and agents to be served equally and for a quiet, bookish voice, but every contract surface is a metadata-only JSON projection. S4 is satisfied by machine output alone."

[[unrepresented]]
id = "guard-apparatus-cost"
stake = "the cost of the guard apparatus itself"
where = "AGENTS.md#documentation-ownership; docs/maintenance.md#performance-acceptance"
why = "Review cost is a named resource the project spends freely: review surfaces, ablations, ceilings, whole-byte rechecks, and a documentation ownership table. No stance defends review cost, diff size, or guard maintenance."

[[unrepresented]]
id = "primitive-reuse"
