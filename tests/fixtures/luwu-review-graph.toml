[[opposition]]
id = "proof-vs-cost"
stances = ["luwu-proof-at-write-stance", "luwu-bounded-cost-stance"]
contended_resource = "latency and throughput of one apply over a whole profile"
recorded_sacrifice = "Cost won twice: per-action expansion is scoped, and later actions no longer compare rendered desired bytes after the first directory creation. Proof won on mtime-only checks, parallel writers, and counting durability inside the budget."
state = "decided"

[[opposition]]
id = "exposure-vs-continuity"
stances = ["luwu-minimal-exposure-stance", "luwu-continuable-evidence-stance"]
contended_resource = "user-visible surface and correctness of the operator's next step"
recorded_sacrifice = "Exposure won: no undeclared-value record, no secret digest, no provider cache. Evidence won where it costs no value: plan evidence, replacement flags, skip reason codes, and committed-but-baseline-not-advanced."
state = "decided"

[[opposition]]
id = "authority-vs-completion"
stances = ["luwu-answerable-authority-stance", "luwu-operational-completion-stance"]
contended_resource = "operator attention and migration cost of moving a real profile"
recorded_sacrifice = "Completion won inside one resource: apply writes a forward field while a sibling field needs review. Authority won on the generic rule: no force or precedence flag, no whole-file reverse copy, no automatic Dotter conversion."
state = "decided"

[[opposition]]
id = "footprint-vs-recovery"
stances = ["luwu-minimal-footprint-stance", "luwu-continuable-evidence-stance"]
contended_resource = "reversibility and durability of what a failed run leaves behind"
recorded_sacrifice = "Footprint won: no transaction engine, journal, durable plan, replay, or rollback; a fresh plan is the recovery step. A SIGKILL between naming and renaming can leave a private temporary file that nothing sweeps."
state = "decided"

[[opposition]]
id = "equivalence-vs-noise"
stances = ["luwu-proven-equivalence-stance", "luwu-quiet-signal-stance"]
contended_resource = "correctness and the operator attention a false difference costs"
recorded_sacrifice = "Equivalence won: no generic formatter or schema registry, a lexical TOML patcher with byte-level negative controls, re-render proof before an undeclared write. Quiet won where evidence exists: structured semantic equality and a baseline-only write for a converged template."
state = "decided"

[[unrepresented]]
stake = "platform reach"
where = "docs/design.md; docs/roadmap.md#m9-real-project-migration-qualification; docs/status.md#provider-fields-and-real-rbw-acceptance"
why = "openat2 fallbacks, O_TMPFILE without a named fallback, refused executables, and Linux-first qualification spend reach repeatedly, but no value test or non-goal defends it."

[[unrepresented]]
stake = "strong consistency against non-cooperating writers"
where = "docs/reference.md#commands; docs/design.md#rejected-alternatives; docs/status.md#verified-scope-and-limits"
why = "Advisory locks, rejected parallel writers, and no snapshot are stated as limits; neither strong consistency nor concurrency has a stance."

[[unrepresented]]
stake = "machine adaptation"
where = "docs/status.md#current-capability-matrix; docs/product.md#the-problem"
why = "Profiles have explicit selection and no platform detection, while the product problem starts from different machines having different boundaries. One declaration for several machines has no owner."

[[unrepresented]]
stake = "the human-facing surface"
where = "docs/product.md#what-luwu-is-becoming"
why = "The product asks for people and agents to be served equally and for a quiet, bookish voice, but every contract surface is a metadata-only JSON projection. S4 is satisfied by machine output alone."

[[unrepresented]]
stake = "the cost of the guard apparatus itself"
where = "AGENTS.md#documentation-ownership; docs/maintenance.md#performance-acceptance"
why = "Review cost is a named resource the project spends freely: review surfaces, ablations, ceilings, whole-byte rechecks, and a documentation ownership table. No stance defends review cost, diff size, or guard maintenance."

[[resolved]]
conflict = "C-1a: the plan must not report a narrow effective_mode for a wide live file"
resolution = "Disclose the live mode in the projection and take effective_mode from the observation. Adds no write, so skipped means untouched is untouched."
serves = "both: exposure gets the missing fact, proof keeps the guarantee"
evidence = "docs/decisions/c-1a-disclosure-buffer.md"
owner_document = "docs/decisions/c-1a-disclosure-buffer.md"
status = "decided_not_implemented"
reopen_when = "the projection or the skipped-means-untouched contract changes"
